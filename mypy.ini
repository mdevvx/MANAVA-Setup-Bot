[mypy]
python_version = 3.12
# Project convention: mypy-clean where practical (see CLAUDE.md).
warn_unused_ignores = True
warn_redundant_casts = True

# asyncpg ships no py.typed / stubs. The DB layer already treats its objects
# as dynamic; silence the import-untyped noise so real findings stand out.
[mypy-asyncpg]
ignore_missing_imports = True

[mypy-asyncpg.*]
ignore_missing_imports = True
